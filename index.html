<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Converter</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dcdcdc">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
        }

        :root {
            --bg-gradient: linear-gradient(135deg, #e0e0e0 0%, #f5f5f5 50%, #bebebe 100%);
            --container-bg: rgba(255, 255, 255, 0.65);
            --card-border: rgba(255, 255, 255, 0.5);
            --text-color: #222222;
            --input-bg: rgba(255, 255, 255, 0.8);
            --input-border: rgba(0, 0, 0, 0.1);
            --rate-box-bg: #222222;
            --rate-box-text: #ffffff;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #121212 0%, #1e1e1e 50%, #2c2c2c 100%);
            --container-bg: rgba(30, 30, 30, 0.65);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-color: #e0e0e0;
            --input-bg: rgba(50, 50, 50, 0.8);
            --input-border: rgba(255, 255, 255, 0.1);
            --rate-box-bg: #333333;
            --rate-box-text: #00ffcc;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 10px 15px;
            overflow-x: hidden;
        }

        .header-actions {
            display: flex;
            justify-content: flex-end;
            max-width: 420px;
            width: 100%;
            margin: 0 auto 10px auto;
        }

        .theme-btn {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            background: var(--container-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .pwa-badge {
            display: none;
            background: linear-gradient(90deg, #444, #222);
            color: #ffffff;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 12px;
            font-size: 0.85rem;
        }

        .input-group {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 10px;
            position: relative;
        }

        .input-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-color);
            margin-bottom: 3px;
            font-weight: 600;
            opacity: 0.8;
        }

        .input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .input-row input {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
            width: 75%;
            outline: none;
            font-weight: 400;
        }

        .unit {
            font-size: 0.9rem;
            color: #ffffff;
            font-weight: 600;
            background: #333333;
            padding: 3px 10px;
            border-radius: 6px;
        }

        .price-display-box {
            text-align: center;
            padding: 8px;
            margin-bottom: 10px;
            background: var(--rate-box-bg);
            border-radius: 12px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        .price-display-box span {
            font-size: 0.8rem;
            color: #aaaaaa;
        }

        .price-display-box .current-rate {
            font-size: 1.25rem;
            color: var(--rate-box-text);
            font-weight: 700;
            margin-left: 8px;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }

        .preset-btn {
            background: linear-gradient(145deg, #ffffff, #dddddd);
            border: 1px solid rgba(0,0,0,0.15);
            color: #222222;
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .preset-btn.active {
            background: linear-gradient(145deg, #333333, #111111);
            color: #ffffff;
            border-color: #000000;
        }

        .custom-rate-group {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 12px;
        }

        .custom-rate-group input {
            background: transparent;
            border: none;
            color: #b8860b;
            font-size: 1.1rem;
            width: 100%;
            outline: none;
            margin-top: 2px;
            font-weight: 600;
        }

        /* Action Buttons (Clear & Save) */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .action-btn {
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .clear-btn { background: #ff4d4d; color: white; }
        .save-btn { background: #28a745; color: white; }

        /* History Panel */
        .history-box {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 10px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 0.8rem;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .brand-footer {
            margin-top: auto;
            padding: 30px 0 20px 0;
            text-align: center;
        }

        .brand-text {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #444444 0%, #111111 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 2px 4px rgba(255,255,255,0.5);
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="header-actions">
    <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">🌙 Dark Mode</button>
</div>

<div class="app-container">
    <div id="installApp" class="pwa-badge">📱 နှိပ်ပြီး ဖုန်းထဲမှာ App အဖြစ် သတ်မှတ်ရန်</div>

    <div class="price-display-box">
        <span>လက်ရှိ သတ်မှတ်စျေးနှုန်း:</span>
        <span class="current-rate" id="currentRateDisplay">၅,၀၀၀ ကျပ်</span>
    </div>

    <div class="input-group">
        <div class="input-label">လီတာ အရေအတွက် (Liters)</div>
        <div class="input-row">
            <input type="number" id="literInput" placeholder="0.000" step="0.001">
            <span class="unit">Li</span>
        </div>
    </div>

    <div class="input-group">
        <div class="input-label">သင့်ငွေ (Amount)</div>
        <div class="input-row">
            <input type="number" id="amountInput" placeholder="0">
            <span class="unit">Ks</span>
        </div>
    </div>

    <div class="input-label" style="margin-bottom: 5px; color: var(--text-color);">သတ်မှတ်ပြီးသား နှုန်းထားများ</div>
    <div class="preset-grid">
        <button class="preset-btn active" onclick="setPrice(5000, this)">5000</button>
        <button class="preset-btn" onclick="setPrice(5500, this)">5500</button>
        <button class="preset-btn" onclick="setPrice(6000, this)">6000</button>
        <button class="preset-btn" onclick="setPrice(6500, this)">6500</button>
        <button class="preset-btn" onclick="setPrice(7000, this)">7000</button>
        <button class="preset-btn" onclick="setPrice(7500, this)">7500</button>
        <button class="preset-btn" onclick="setPrice(8000, this)">8000</button>
    </div>

    <div class="custom-rate-group">
        <div class="input-label" style="color: #b8860b;">သတ်မှတ်ရန် (စိတ်ကြိုက် စျေးနှုန်း)</div>
        <input type="number" id="customPriceInput" placeholder="စျေးနှုန်း အသစ်ရိုက်ထည့်ပါ...">
    </div>

    <div class="action-grid">
        <button class="action-btn clear-btn" onclick="clearInputs()">Clear</button>
        <button class="action-btn save-btn" onclick="saveToHistory()">Save Data</button>
    </div>

    <div class="input-label" style="margin-bottom: 5px;">လတ်တလော မှတ်တမ်းများ</div>
    <div class="history-box" id="historyContainer">
        <div style="color:#888; text-align:center; padding-top:10px;">မှတ်တမ်းမရှိသေးပါ။</div>
    </div>
</div>

<div class="brand-footer">
    <div class="brand-text">TZLOM & Gemini</div>
</div>

<script>
    let activePrice = 5000;
    const literInput = document.getElementById('literInput');
    const amountInput = document.getElementById('amountInput');
    const customPriceInput = document.getElementById('customPriceInput');
    const currentRateDisplay = document.getElementById('currentRateDisplay');
    const historyContainer = document.getElementById('historyContainer');

    function setPrice(price, element) {
        activePrice = price;
        customPriceInput.value = ''; 
        currentRateDisplay.innerText = price.toLocaleString() + " ကျပ်";
        
        document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
        if(element) element.classList.add('active');
        
        recalculate('liter');
    }

    customPriceInput.addEventListener('input', () => {
        let val = parseFloat(customPriceInput.value);
        if (val > 0) {
            activePrice = val;
            currentRateDisplay.innerText = val.toLocaleString() + " ကျပ်";
            document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
            recalculate('liter');
        }
    });

    literInput.addEventListener('input', () => recalculate('liter'));
    amountInput.addEventListener('input', () => recalculate('amount'));

    function recalculate(source) {
        if (!activePrice || activePrice <= 0) return;

        if (source === 'liter') {
            let liters = parseFloat(literInput.value);
            if (!isNaN(liters)) {
                amountInput.value = Math.round(liters * activePrice);
            } else {
                amountInput.value = '';
            }
        } else if (source === 'amount') {
            let amount = parseFloat(amountInput.value);
            if (!isNaN(amount)) {
                let calculatedLiter = amount / activePrice;
                literInput.value = calculatedLiter.toFixed(3);
            } else {
                literInput.value = '';
            }
        }
    }

    // New Function: Clear Inputs
    function clearInputs() {
        literInput.value = '';
        amountInput.value = '';
    }

    // New Function: Dark/Light Mode Theme
    function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById('themeToggle');
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            btn.innerText = "🌙 Dark Mode";
        } else {
            body.setAttribute('data-theme', 'dark');
            btn.innerText = "☀️ Light Mode";
        }
    }

    // New Function: LocalStorage History Tracker
    function saveToHistory() {
        let lit = literInput.value;
        let amt = amountInput.value;
        if(!lit || !amt) return;

        let history = JSON.parse(localStorage.getItem('fuel_history')) || [];
        history.unshift({ liter: lit, amount: amt, rate: activePrice });
        if(history.length > 5) history.pop(); // Keep only last 5 items
        localStorage.setItem('fuel_history', JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        let history = JSON.parse(localStorage.getItem('fuel_history')) || [];
        if(history.length === 0) {
            historyContainer.innerHTML = `<div style="color:#888; text-align:center; padding-top:10px;">မှတ်တမ်းမရှိသေးပါ။</div>`;
            return;
        }
        historyContainer.innerHTML = history.map(item => `
            <div class="history-item">
                <span>${item.liter} Li @ ${item.rate} Ks</span>
                <strong>${parseInt(item.amount).toLocaleString()} Ks</strong>
            </div>
        `).join('');
    }

    // Load History on Start
    window.onload = () => { renderHistory(); };

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker Registered'))
            .catch(err => console.log('Service Worker Failed', err));
        });
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installApp');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block'; 
    });

    installBtn.addEventListener('click', () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            });
        }
    });
</script>
</body>
</html>
