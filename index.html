<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Converter</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dcdcdc">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* ငွေရောင် အရောင်ပြေး စတိုင် နောက်ခံ */
            background: linear-gradient(135deg, #e0e0e0 0%, #f5f5f5 50%, #bebebe 100%);
            color: #222222;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 10px 15px;
            overflow-x: hidden;
        }

        /* အပေါ်ပိုင်းတစ်ဝက်ပဲ နေရာယူမည့် App Container */
        .app-container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .pwa-badge {
            display: none;
            background: linear-gradient(90deg, #444, #222);
            color: #ffffff;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 12px;
            font-size: 0.85rem;
        }

        .input-group {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .input-group:focus-within {
            border-color: #666666;
            box-shadow: 0 0 8px rgba(0,0,0,0.08);
        }

        .input-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #555555;
            margin-bottom: 3px;
            font-weight: 600;
        }

        .input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .input-row input {
            background: transparent;
            border: none;
            color: #111111;
            font-size: 1.5rem;
            width: 75%;
            outline: none;
            font-weight: 400;
        }

        .unit {
            font-size: 0.9rem;
            color: #ffffff;
            font-weight: 600;
            background: #333333;
            padding: 3px 10px;
            border-radius: 6px;
        }

        /* Fixed Price Display */
        .price-display-box {
            text-align: center;
            padding: 8px;
            margin-bottom: 10px;
            background: #222222;
            border-radius: 12px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        .price-display-box span {
            font-size: 0.8rem;
            color: #aaaaaa;
        }

        .price-display-box .current-rate {
            font-size: 1.25rem;
            color: #ffffff;
            font-weight: 700;
            margin-left: 8px;
        }

        /* Preset Buttons - (၇) မျိုးဆံ့အောင် ညှိထားပါတယ် */
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }

        .preset-btn {
            background: linear-gradient(145deg, #ffffff, #dddddd);
            border: 1px solid rgba(0,0,0,0.15);
            color: #222222;
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .preset-btn.active {
            background: linear-gradient(145deg, #333333, #111111);
            color: #ffffff;
            border-color: #000000;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }

        /* Custom Rate Input */
        .custom-rate-group {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            padding: 8px 12px;
        }

        .custom-rate-group input {
            background: transparent;
            border: none;
            color: #b8860b;
            font-size: 1.1rem;
            width: 100%;
            outline: none;
            margin-top: 2px;
            font-weight: 600;
        }

        .custom-rate-group input::placeholder {
            color: #888888;
        }

        /* အောက်ခြေလွတ်နေသောနေရာတွင် ပြသမည့် စာသားစတိုင် */
        .brand-footer {
            margin-top: auto;
            padding: 30px 0 20px 0;
            text-align: center;
        }

        .brand-text {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #444444 0%, #111111 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 2px 4px rgba(255,255,255,0.5);
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div id="installApp" class="pwa-badge">📱 နှိပ်ပြီး ဖုန်းထဲမှာ App အဖြစ် သတ်မှတ်ရန်</div>

    <div class="price-display-box">
        <span>လက်ရှိ သတ်မှတ်စျေးနှုန်း:</span>
        <span class="current-rate" id="currentRateDisplay">၅,၀၀၀ ကျပ်</span>
    </div>

    <div class="input-group">
        <div class="input-label">လီတာ အရေအတွက် (Liters)</div>
        <div class="input-row">
            <input type="number" id="literInput" placeholder="0.000" step="0.001">
            <span class="unit">Li</span>
        </div>
    </div>

    <div class="input-group">
        <div class="input-label">သင့်ငွေ (Amount)</div>
        <div class="input-row">
            <input type="number" id="amountInput" placeholder="0">
            <span class="unit">Ks</span>
        </div>
    </div>

    <div class="input-label" style="margin-bottom: 5px; color: #444;">သတ်မှတ်ပြီးသား နှုန်းထားများ</div>
    <div class="preset-grid">
        <button class="preset-btn active" onclick="setPrice(5000, this)">5000</button>
        <button class="preset-btn" onclick="setPrice(5500, this)">5500</button>
        <button class="preset-btn" onclick="setPrice(6000, this)">6000</button>
        <button class="preset-btn" onclick="setPrice(6500, this)">6500</button>
        <button class="preset-btn" onclick="setPrice(7000, this)">7000</button>
        <button class="preset-btn" onclick="setPrice(7500, this)">7500</button>
        <button class="preset-btn" onclick="setPrice(8000, this)">8000</button>
    </div>

    <div class="custom-rate-group">
        <div class="input-label" style="color: #8b6508;">သတ်မှတ်ရန် (စိတ်ကြိုက် စျေးနှုန်း)</div>
        <input type="number" id="customPriceInput" placeholder="စျေးနှုန်း အသစ်ရိုက်ထည့်ပါ...">
    </div>
</div>

<div class="brand-footer">
    <div class="brand-text">TZLOM & Gemini</div>
</div>

<script>
    let activePrice = 5000;
    const literInput = document.getElementById('literInput');
    const amountInput = document.getElementById('amountInput');
    const customPriceInput = document.getElementById('customPriceInput');
    const currentRateDisplay = document.getElementById('currentRateDisplay');

    function setPrice(price, element) {
        activePrice = price;
        customPriceInput.value = ''; 
        currentRateDisplay.innerText = price.toLocaleString() + " ကျပ်";
        
        document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
        if(element) element.classList.add('active');
        
        recalculate('liter');
    }

    customPriceInput.addEventListener('input', () => {
        let val = parseFloat(customPriceInput.value);
        if (val > 0) {
            activePrice = val;
            currentRateDisplay.innerText = val.toLocaleString() + " ကျပ်";
            document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
            recalculate('liter');
        }
    });

    literInput.addEventListener('input', () => recalculate('liter'));
    amountInput.addEventListener('input', () => recalculate('amount'));

    function recalculate(source) {
        if (!activePrice || activePrice <= 0) return;

        if (source === 'liter') {
            let liters = parseFloat(literInput.value);
            if (!isNaN(liters)) {
                amountInput.value = Math.round(liters * activePrice);
            } else {
                amountInput.value = '';
            }
        } else if (source === 'amount') {
            let amount = parseFloat(amountInput.value);
            if (!isNaN(amount)) {
                let calculatedLiter = amount / activePrice;
                literInput.value = calculatedLiter.toFixed(3);
            } else {
                literInput.value = '';
            }
        }
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker Registered'))
            .catch(err => console.log('Service Worker Failed', err));
        });
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installApp');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block'; 
    });

    installBtn.addEventListener('click', () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            });
        }
    });
</script>
</body>
</html>
